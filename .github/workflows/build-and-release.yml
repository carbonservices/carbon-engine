name: Build and Release Carbon ESG

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows Build & Packaging Job
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build & Package Windows (NSIS)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Build Tools (Ninja & NASM)
        shell: pwsh
        run: |
          choco install ninja nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: pip install aqtinstall

      - name: Cache Qt installation on Windows
        uses: actions/cache@v5
        with:
          path: C:\Qt\6.10.0\msvc2022_64
          key: ${{ runner.os }}-qt-6.10.0-v1

      - name: Install Qt 6.10.0 for MSVC
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Qt\6.10.0\msvc2022_64\bin\qmake.exe")) {
            aqt install-qt windows desktop 6.10.0 win64_msvc2022_64 --outputdir "C:\Qt" -m qtwebengine qtpositioning qtwebchannel qthttpserver qtwebsockets
          }
          echo "CMAKE_PREFIX_PATH=C:\Qt\6.10.0\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\Qt\6.10.0\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Determine Dynamic Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${V}" >> $GITHUB_OUTPUT
          echo "CARBON_ENGINE_VERSION=${V}" >> $GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="C:/Qt/6.10.0/msvc2022_64" \
            -DCARBON_ENGINE_VERSION="${{ steps.ver.outputs.VERSION }}" \
            -DCARBON_ENGINE_DOWNLOAD_MODELS=OFF

      - name: Build Carbon ESG & Carbon Engine
        run: cmake --build build --config Release --parallel

      - name: Package with CPack (NSIS)
        shell: bash
        working-directory: build
        run: |
          cpack -C Release -G "NSIS" || {
            echo "=== NSISOutput.log ==="
            cat _CPack_Packages/win64/NSIS/NSISOutput.log 2>/dev/null || true
            exit 1
          }

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: build/CarbonESG-*-Windows-x64*.exe
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Linux Build & Packaging Job
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build & Package Linux (DEB)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            wget \
            ninja-build \
            build-essential \
            libgl1-mesa-dev \
            mesa-common-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-xinerama0-dev \
            libopenblas-dev \
            liblapack-dev \
            libegl1-mesa-dev \
            libglvnd-dev \
            libpulse-dev \
            uuid-dev \
            file

      - name: Cache Qt installation on Linux
        uses: actions/cache@v5
        with:
          path: /home/runner/work/Qt/6.10.0/gcc_64
          key: ${{ runner.os }}-qt-6.10.0-v1

      - name: Install aqtinstall
        run: pip install aqtinstall --break-system-packages

      - name: Install Qt 6.10.0 on Linux
        run: |
          if [ ! -f "/home/runner/work/Qt/6.10.0/gcc_64/bin/qmake" ]; then
            aqt install-qt linux desktop 6.10.0 linux_gcc_64 --outputdir /home/runner/work/Qt -m qtwebengine qtpositioning qtwebchannel qthttpserver qtwebsockets
          fi
          echo "QT_PLUGIN_PATH=/home/runner/work/Qt/6.10.0/gcc_64/plugins" >> $GITHUB_ENV
          echo "QML2_IMPORT_PATH=/home/runner/work/Qt/6.10.0/gcc_64/qml" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/home/runner/work/Qt/6.10.0/gcc_64" >> $GITHUB_ENV
          echo "/home/runner/work/Qt/6.10.0/gcc_64/bin" >> $GITHUB_PATH

      - name: Determine Dynamic Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            V="${BASH_REMATCH[1]}"
          else
            V="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${V}" >> $GITHUB_OUTPUT
          echo "CARBON_ENGINE_VERSION=${V}" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/home/runner/work/Qt/6.10.0/gcc_64" \
            -DCARBON_ENGINE_VERSION="${{ steps.ver.outputs.VERSION }}" \
            -DCARBON_ENGINE_DOWNLOAD_MODELS=OFF

      - name: Build Carbon ESG & Carbon Engine
        run: cmake --build build --config Release --parallel

      - name: Package with CPack (DEB)
        working-directory: build
        run: cpack -C Release -G "DEB"

      - name: Upload Linux Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: build/CarbonESG-*-Linux-x64*.deb
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Release Publication Job (Triggered on Tags pushed to master)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-artifacts/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release-artifacts/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Carbon ESG ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/windows/*.exe
            release-artifacts/linux/*.deb
